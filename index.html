<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search" role="search">
            <input id="cityInput" type="text" placeholder="Enter city name" spellcheck="false" autocomplete="off" aria-label="City name">
            <button id="searchBtn" type="button" aria-label="Search weather">
                <img src="images/search.png" alt="" width="22" height="22">
            </button>
        </div>

        <div class="status" aria-live="polite"></div>

        <div class="error" role="alert">
            <p class="error-text">Invalid city name</p>
        </div>

        <div class="weather">
            <img src="images/rain.png" alt="weather icon" class="weather-icon">
            <h1 class="temp">22&#176;C</h1>
            <h2 class="city">London</h2>

            <p class="desc"></p>
            <p class="feels">Feels like: <span class="feels-like"></span></p>

            <div class="details">
                <div class="col">
                    <img src="images/wind.png" alt="wind icon">
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>wind speed</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/humidity.png" alt="humidity icon">
                    <div>
                        <p class="humidity">50%</p>
                        <p>humidity</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
