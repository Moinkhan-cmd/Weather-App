<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search" role="search">
            <input id="cityInput" type="text" placeholder="Enter city name..." spellcheck="false" autocomplete="off" aria-label="City name">
            <button id="searchBtn" type="button" aria-label="Search weather">
                <img src="images/search.png" alt="" width="22" height="22">
            </button>
        </div>

        <div class="status" aria-live="polite"></div>

        <div class="error" role="alert">
            <p class="error-text">Invalid city name</p>
        </div>

        <div class="weather">
            <!-- Header with City and Live Time -->
            <div class="weather-header">
                <div>
                    <h2 class="city">--</h2>
                    <p class="date">--</p>
                </div>
                <div class="live-clock">--:--</div>
            </div>

            <div class="weather-main">
                <img src="images/rain.png" alt="weather icon" class="weather-icon">
                <h1 class="temp">--&#176;</h1>
                <p class="desc">--</p>
                <p class="feels">Feels like <span class="feels-like">--</span>&#176;</p>
            </div>

            <div class="details">
                <div class="col">
                    <img src="images/humidity.png" alt="humidity icon">
                    <div>
                        <p class="humidity">--%</p>
                        <p class="label">Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/wind.png" alt="wind icon">
                    <div>
                        <p class="wind">-- km/h</p>
                        <p class="label">Wind Speed</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/mist.png" alt="pressure icon" style="filter: brightness(0) invert(1);"> 
                    <!-- Using mist icon as placeholder or generic icon for pressure if no other available, styled white -->
                    <div>
                        <p class="pressure">-- hPa</p>
                        <p class="label">Pressure</p>
                    </div>
                </div>
            </div>
            
            <p class="last-updated">Last updated: <span id="updateTime">--</span></p>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
